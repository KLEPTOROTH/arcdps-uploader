name: CMake

on:
  push:
    branches:
      - master
    tags:
      - v0.*
      - v1.*
  workflow_dispatch:

env:
  BUILD_TYPE: Release
  VCPKG_TARGET_TRIPLET: x64-windows-static

jobs:
  build:
    runs-on: windows-2022

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: 'recursive'

    - name: vcpkg
      run: vcpkg integrate install

    - name: Configure CMake
      run: cmake -B ${{github.workspace}}/build -A x64 -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake -DVCPKG_TARGET_TRIPLET=${{env.VCPKG_TARGET_TRIPLET}}

    - name: Build
      run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}}

    - name: Smoke test (headless, imgui 19270)
      working-directory: ${{github.workspace}}/build/Release
      run: .\uploader_smoketest.exe

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: d3d9_uploader
        path: ${{github.workspace}}/build/Release/d3d9_uploader.dll

    - name: Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        draft: true
        generate_release_notes: true
        files: ${{github.workspace}}\build\Release\d3d9_uploader.dll
